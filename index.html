<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>📘 TEC Assessment – All MCQs</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f4f7fc;
            padding: 10px 10px 30px;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(145deg, #0b2b4a, #1a4b6d);
            color: #fff;
            padding: 18px 16px 16px;
            border-radius: 18px;
            margin-bottom: 18px;
            box-shadow: 0 8px 24px rgba(11, 43, 74, 0.25);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.2px;
            line-height: 1.3;
        }
        .header h1 span {
            font-weight: 300;
            opacity: 0.8;
            font-size: 14px;
            display: block;
            margin-top: 2px;
        }
        .header .score-box {
            background: rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            align-self: flex-start;
            touch-action: manipulation;
        }
        .header .score-box span {
            font-weight: 300;
            font-size: 13px;
            opacity: 0.8;
        }

        /* ===== SET NAV (horizontally scrollable on mobile) ===== */
        .set-nav {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 6px;
            margin-bottom: 18px;
            background: #fff;
            padding: 10px 12px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            border: 1px solid #e9edf4;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #eef2f7;
        }
        .set-nav::-webkit-scrollbar {
            height: 4px;
        }
        .set-nav::-webkit-scrollbar-track {
            background: #eef2f7;
            border-radius: 8px;
        }
        .set-nav::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .set-nav button {
            flex: 0 0 auto;
            background: #eef2f7;
            border: none;
            padding: 10px 14px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
            touch-action: manipulation;
            white-space: nowrap;
            min-height: 44px;
            min-width: 56px;
            text-align: center;
        }
        .set-nav button:active {
            transform: scale(0.96);
        }
        .set-nav button.active {
            background: #1a4b6d;
            color: #fff;
            border-color: #1a4b6d;
            box-shadow: 0 4px 10px rgba(26, 75, 109, 0.25);
        }

        /* ===== SET SECTIONS ===== */
        .set-section {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .set-section.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .set-title {
            font-size: 19px;
            font-weight: 700;
            color: #0b2b4a;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .set-title .badge {
            background: #1a4b6d;
            color: #fff;
            font-size: 12px;
            padding: 2px 14px;
            border-radius: 40px;
            font-weight: 500;
        }
        .set-sub {
            color: #475569;
            font-size: 14px;
            margin-bottom: 16px;
            border-left: 4px solid #1a4b6d;
            padding-left: 14px;
            background: #f8faff;
            border-radius: 0 12px 12px 0;
            line-height: 1.5;
        }

        /* ===== QUESTION CARD ===== */
        .q-card {
            background: #fff;
            border-radius: 16px;
            padding: 16px 14px;
            margin-bottom: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid #e9edf4;
            transition: 0.15s;
            touch-action: manipulation;
        }
        .q-card.correct {
            border-left: 6px solid #22c55e;
            background: #f0fdf4;
        }
        .q-card.wrong {
            border-left: 6px solid #ef4444;
            background: #fef2f2;
        }

        .q-card .q-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
        }
        .q-card .q-num {
            font-weight: 600;
            color: #1a4b6d;
            font-size: 13px;
            background: #e8f0fe;
            padding: 2px 12px;
            border-radius: 40px;
            white-space: nowrap;
        }
        .q-card .q-status {
            font-size: 13px;
            font-weight: 500;
        }
        .q-card .q-status .icon {
            font-size: 16px;
        }

        .q-card .q-en {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.5;
            margin: 4px 0 4px 0;
            color: #0b2b4a;
        }
        .q-card .q-hi {
            font-size: 14px;
            color: #475569;
            background: #f8fafc;
            padding: 10px 12px;
            border-radius: 12px;
            margin: 6px 0 14px 0;
            border: 1px solid #eef2f7;
            line-height: 1.6;
        }
        .q-card .q-hi::before {
            content: '🔄 ';
            font-size: 13px;
        }

        /* ===== OPTIONS ===== */
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
            margin: 10px 0 8px 0;
        }
        @media (max-width: 600px) {
            .options {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8fafc;
            padding: 14px 14px;
            border-radius: 12px;
            border: 1px solid #e9edf4;
            cursor: pointer;
            transition: 0.15s;
            font-size: 15px;
            font-weight: 450;
            touch-action: manipulation;
            min-height: 48px;
        }
        .options label:active {
            transform: scale(0.98);
        }
        .options input[type="radio"] {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            accent-color: #1a4b6d;
            cursor: pointer;
            touch-action: manipulation;
        }
        .options label.correct-opt {
            background: #dcfce7;
            border-color: #22c55e;
        }
        .options label.wrong-opt {
            background: #fee2e2;
            border-color: #ef4444;
        }
        .options label.disabled-opt {
            opacity: 0.6;
            cursor: default;
        }
        .options label.disabled-opt:active {
            transform: none;
        }

        /* ===== ANSWER REVEAL ===== */
        .q-answer {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 8px;
            word-break: break-word;
        }
        .q-answer.show {
            display: flex;
        }
        .q-answer.correct-ans {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }
        .q-answer.wrong-ans {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }
        .q-answer .ans-label {
            font-weight: 600;
            flex-shrink: 0;
        }

        /* ===== FOOTER ACTIONS ===== */
        .footer-actions {
            margin-top: 26px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .footer-actions button {
            background: #fff;
            border: 1px solid #cbd5e1;
            padding: 12px 18px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            touch-action: manipulation;
            flex: 1 1 auto;
            min-width: 100px;
            text-align: center;
            min-height: 48px;
        }
        .footer-actions button:active {
            transform: scale(0.96);
        }
        .footer-actions button.primary {
            background: #1a4b6d;
            border-color: #1a4b6d;
            color: #fff;
        }
        .footer-actions button.primary:active {
            background: #0b2b4a;
        }

        .progress-text {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #64748b;
        }

        /* ===== SCROLL TOP BUTTON ===== */
        .scroll-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a4b6d;
            color: #fff;
            border: none;
            border-radius: 60px;
            padding: 14px 18px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(26, 75, 109, 0.35);
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 100;
            touch-action: manipulation;
            min-height: 52px;
            min-width: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scroll-top.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .scroll-top:active {
            transform: scale(0.92);
        }

        /* ===== EXTRA MOBILE TWEAKS ===== */
        @media (max-width: 480px) {
            body {
                padding: 6px 6px 20px;
            }
            .header {
                padding: 14px 12px;
                border-radius: 14px;
            }
            .header h1 {
                font-size: 18px;
            }
            .header .score-box {
                font-size: 14px;
                padding: 6px 14px;
            }
            .set-nav {
                padding: 8px 10px;
                gap: 5px;
                border-radius: 14px;
            }
            .set-nav button {
                font-size: 12px;
                padding: 8px 12px;
                min-height: 40px;
                min-width: 48px;
            }
            .q-card {
                padding: 14px 12px;
                border-radius: 14px;
            }
            .q-card .q-en {
                font-size: 15px;
            }
            .q-card .q-hi {
                font-size: 13px;
                padding: 8px 10px;
            }
            .options label {
                font-size: 14px;
                padding: 12px 12px;
                min-height: 44px;
            }
            .options input[type="radio"] {
                width: 22px;
                height: 22px;
            }
            .footer-actions button {
                font-size: 13px;
                padding: 10px 14px;
                min-height: 44px;
                min-width: 80px;
            }
            .scroll-top {
                padding: 12px 14px;
                font-size: 16px;
                min-height: 48px;
                min-width: 48px;
                bottom: 14px;
                right: 14px;
            }
            .set-title {
                font-size: 17px;
            }
            .set-sub {
                font-size: 13px;
            }
            .q-answer {
                font-size: 13px;
                padding: 8px 12px;
            }
        }

        @media (max-width: 380px) {
            .set-nav button {
                font-size: 11px;
                padding: 6px 10px;
                min-width: 40px;
            }
            .q-card .q-en {
                font-size: 14px;
            }
            .options label {
                font-size: 13px;
                padding: 10px 10px;
            }
        }

        /* ===== UTILITY ===== */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div>
                <h1>📘 TEC Assessment <span>All MCQs · Entrepreneurship &amp; Accounting</span></h1>
            </div>
            <div class="score-box">
                <span>🎯</span> <span id="scoreDisplay">0</span> / <span id="totalDisplay">0</span>
                <span style="margin-left:4px; font-weight:400; font-size:13px;">correct</span>
            </div>
        </div>

        <!-- SET NAV -->
        <div class="set-nav" id="setNav"></div>

        <!-- SETS CONTAINER -->
        <div id="setsContainer"></div>

        <!-- FOOTER -->
        <div class="footer-actions">
            <button class="primary" id="resetBtn">🔄 Reset All</button>
            <button id="showAllBtn">📖 Show Answers</button>
            <button id="hideAllBtn">🙈 Hide Answers</button>
        </div>
        <div class="progress-text" id="progressText"></div>

        <!-- SCROLL TOP -->
        <button class="scroll-top" id="scrollTopBtn" aria-label="Scroll to top">⬆ Top</button>
    </div>

    <script>
        // --------------------------------------------------------------
        // DATA — all 68 questions with English, Hinglish, options, answers
        // --------------------------------------------------------------
        const setsData = [{
            id: 1,
            title: 'Entrepreneurship',
            subtitle: 'Basic concepts, risk, startup success, and entrepreneurial activities.',
            questions: [{
                en: 'Which of the following is an example of entrepreneurship?',
                hi: 'निम्नलिखित में से कौन सा उद्यमिता (entrepreneurship) का उदाहरण है?',
                options: [
                    'Starting a business based on an old idea, an existing business module, and low risk',
                    'Teaching at an IIT/MBBS coaching center',
                    'Starting a business based on a new app/software with high risk',
                    'None of the above'
                ],
                answer: 0
            }, {
                en: 'An entrepreneur is a person who takes less risk and avoids experimentation.',
                hi: 'एक उद्यमी (entrepreneur) वह व्यक्ति है जो कम जोखिम लेता है और प्रयोग (experimentation) से बचता है।',
                options: ['True', 'False'],
                answer: 1
            }, {
                en: 'An entrepreneur is involved in FEW of the following activities – management, organization, innovation, risk-taking, etc.',
                hi: 'एक उद्यमी निम्नलिखित में से कुछ गतिविधियों में शामिल होता है – प्रबंधन, संगठन, नवाचार, जोखिम लेना आदि।',
                options: ['True', 'False'],
                answer: 0
            }, {
                en: 'Entrepreneurship is an opportunity to create wealth.',
                hi: 'उद्यमिता (entrepreneurship) धन (wealth) बनाने का एक अवसर है।',
                options: ['True', 'False'],
                answer: 0
            }, {
                en: '92% of startups become successful within the first 3 years of starting.',
                hi: '92% स्टार्टअप शुरू होने के पहले 3 सालों में सफल हो जाते हैं।',
                options: ['True', 'False'],
                answer: 1
            }, {
                en: 'Everyone who starts a business based on a new idea is always successful.',
                hi: 'हर कोई जो नए आइडिया के आधार पर बिजनेस शुरू करता है, हमेशा सफल होता है।',
                options: ['True', 'False'],
                answer: 1
            }, {
                en: 'An entrepreneur performs the following activities – management, organization, and makes all decisions himself/herself.',
                hi: 'एक उद्यमी निम्नलिखित गतिविधियाँ करता है – प्रबंधन, संगठन, और सभी निर्णय स्वयं लेता है।',
                options: ['True', 'False'],
                answer: 0
            }, {
                en: 'A successful entrepreneur can become rich very quickly.',
                hi: 'एक सफल उद्यमी बहुत जल्दी अमीर (rich) बन सकता है।',
                options: ['True', 'False'],
                answer: 0
            }]
        }, {
            id: 2,
            title: 'Entrepreneurship &amp; Entrepreneurial Character',
            subtitle: 'Patience, community, organization, and the entrepreneurial mindset.',
            questions: [{
                en: 'Entrepreneurs should not be greedy to grow big because it also requires patience.',
                hi: 'उद्यमियों को बड़ा बनने के लिए लालची (greedy) नहीं होना चाहिए क्योंकि इसमें धैर्य (patience) भी चाहिए।',
                options: ['True', 'False'],
                answer: 0
            }, {
                en: 'Entrepreneurs need membership in physical communities where they can share ideas.',
                hi: 'उद्यमियों को भौतिक समुदायों (physical communities) में सदस्यता चाहिए जहाँ वे विचार साझा कर सकें।',
                options: ['True', 'False'],
                answer: 0
            }, {
                en: 'To be successful, entrepreneurs must have ______.',
                hi: 'सफल होने के लिए, उद्यमियों के पास ______ होना चाहिए।',
                options: ['Patience', 'Patient', 'Money', 'Luck'],
                answer: 0
            }, {
                en: 'An organization is not an entrepreneur, but people are entrepreneurs.',
                hi: 'एक संगठन (organization) उद्यमी नहीं है, लेकिन लोग उद्यमी होते हैं।',
                options: ['True', 'False'],
                answer: 0
            }, {
                en: 'Building a business takes ______ time compared to generating an idea for the business.',
                hi: 'बिजनेस बनाने में बिजनेस का आइडिया जनरेट करने की तुलना में ______ समय लगता है।',
                options: ['Less/shorter', 'Equal', 'More/longer', 'Cannot say'],
                answer: 2
            }, {
                en: 'Entrepreneurship involves organizing the management and handling of risks related to your venture, and an entrepreneur is someone who is also involved in all these activities.',
                hi: 'उद्यमिता में प्रबंधन को व्यवस्थित करना और आपके उद्यम (venture) से जुड़े जोखिमों को संभालना शामिल है, और एक उद्यमी वह है जो इन सभी गतिविधियों में शामिल होता है।',
                options: ['True', 'False'],
                answer: 0
            }]
        }, {
            id: 3,
            title: 'Identifying Business Opportunities',
            subtitle: 'Evaluating ideas, technical vs market knowledge, and customer needs.',
            questions: [{
                en: 'When evaluating whether an idea is an opportunity or not, upfront capital and R&D hiring costs should be high.',
                hi: 'यह मूल्यांकन करते समय कि कोई आइडिया अवसर (opportunity) है या नहीं, अपफ्रंट कैपिटल और R&D हायरिंग लागत अधिक होनी चाहिए।',
                options: ['True', 'False'],
                answer: 1
            }, {
                en: 'Successful entrepreneurship requires the ability to balance technical knowledge and market knowledge.',
                hi: 'सफल उद्यमिता के लिए तकनीकी ज्ञान (technical knowledge) और बाजार ज्ञान (market knowledge) को संतुलित करने की क्षमता चाहिए।',
                options: ['True', 'False'],
                answer: 0
            }, {
                en: 'How can you identify whether an idea is an opportunity or not?',
                hi: 'आप कैसे पहचान सकते हैं कि कोई आइडिया अवसर (opportunity) है या नहीं?',
                options: [
                    'An idea needs to be made valuable',
                    'An idea needs to fulfill a customer\'s need',
                    'Both are correct',
                    'None of the above'
                ],
                answer: 2
            }]
        }, {
            id: 4,
            title: 'Understanding Cost Structures',
            subtitle: 'Direct labor, fixed costs, expense costs, and transformation degree.',
            questions: [{
                en: '_____ costs include salaries, bonuses, insurance, pension benefits, and accrued leave for the people involved.',
                hi: '_____ लागत में वेतन (salaries), बोनस, बीमा, पेंशन लाभ और शामिल लोगों की accrued छुट्टी शामिल है।',
                options: ['Additional', 'Direct material cost', 'Direct labor cost', 'Unexpected cost'],
                answer: 0
            }, {
                en: '______ is the monetary value of resources such as materials, labor, and overheads that are used for producing or delivering a product or service.',
                hi: '______ उन संसाधनों का मौद्रिक मूल्य (monetary value) है जैसे सामग्री, श्रम और ओवरहेड्स जो किसी उत्पाद या सेवा के उत्पादन या वितरण के लिए उपयोग किए जाते हैं।',
                options: ['Input', 'Receipts', 'Inventory', 'Cost'],
                answer: 3
            }, {
                en: 'Retail companies such as Reliance Fresh, D-Mart, and Big Bazaar have a ______ to ______ degree of transformation.',
                hi: 'रिटेल कंपनियाँ जैसे Reliance Fresh, D-Mart और Big Bazaar में ______ से ______ तक ट्रांसफॉर्मेशन की डिग्री होती है।',
                options: ['Low to medium', 'Medium to high', 'Bottom to top', 'High to medium'],
                answer: 1
            }, {
                en: 'Costs that do not vary in the short term regardless of changes in the level of production are called ______ costs.',
                hi: 'जो लागतें उत्पादन स्तर में बदलाव के बावजूद अल्पावधि (short term) में नहीं बदलतीं, उन्हें ______ लागत कहते हैं।',
                options: ['Direct costs', 'Indirect costs', 'Fixed costs', 'Expense costs'],
                answer: 2

            set.questions.forEach((q, idx) => {
                const globalIdx = allQuestions.findIndex(aq =>
                    aq.setId === set.id && aq.qIdx === idx
                );
                const card = document.createElement('div');
                card.className = 'q-card';
                card.id = `q-${globalIdx}`;

                // Head
                const head = document.createElement('div');
                head.className = 'q-head';
                const numSpan = document.createElement('span');
                numSpan.className = 'q-num';
                numSpan.textContent = `Q${globalIdx + 1}`;
                const statusSpan = document.createElement('span');
                statusSpan.className = 'q-status';
                statusSpan.id = `status-${globalIdx}`;
                head.appendChild(numSpan);
                head.appendChild(statusSpan);
                card.appendChild(head);

                // English
                const enP = document.createElement('div');
                enP.className = 'q-en';
                enP.textContent = q.en;
                card.appendChild(enP);

                // Hinglish
                const hiP = document.createElement('div');
                hiP.className = 'q-hi';
                hiP.textContent = q.hi;
                card.appendChild(hiP);

                // Options
                const optContainer = document.createElement('div');
                optContainer.className = 'options';
                const letters = ['a', 'b', 'c', 'd'];
                q.options.forEach((opt, oi) => {
                    const label = document.createElement('label');
                    label.className = 'opt-label';
                    label.id = `opt-${globalIdx}-${oi}`;
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q-${globalIdx}`;
                    radio.value = oi;
                    radio.dataset.globalIdx = globalIdx;
                    radio.addEventListener('change', () => handleAnswer(globalIdx, oi));
                    const span = document.createElement('span');
                    span.textContent = `${letters[oi]}) ${opt}`;
                    label.appendChild(radio);
                    label.appendChild(span);
                    optContainer.appendChild(label);
                });
                card.appendChild(optContainer);

                // Answer reveal
                const ansDiv = document.createElement('div');
                ansDiv.className = 'q-answer';
                ansDiv.id = `ans-${globalIdx}`;
                const ansLabel = document.createElement('span');
                ansLabel.className = 'ans-label';
                const ansText = document.createElement('span');
                ansText.id = `ans-text-${globalIdx}`;
                ansDiv.appendChild(ansLabel);
                ansDiv.appendChild(ansText);
                card.appendChild(ansDiv);

                section.appendChild(card);
            });

            setsContainer.appendChild(section);
        });

        // Activate first set
        switchSet(1);

        // --------------------------------------------------------------
        // CORE FUNCTIONS
        // --------------------------------------------------------------
        function switchSet(id) {
            document.querySelectorAll('.set-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.set-nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(`set-${id}`).classList.add('active');
            const btn = document.querySelector(`.set-nav button[data-set-id="${id}"]`);
            if (btn) btn.classList.add('active');
            // scroll to set top
            const el = document.getElementById(`set-${id}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function handleAnswer(globalIdx, selected) {
            const q = allQuestions[globalIdx];
            const card = document.getElementById(`q-${globalIdx}`);
            const statusEl = document.getElementById(`status-${globalIdx}`);
            const ansDiv = document.getElementById(`ans-${globalIdx}`);
            const ansText = document.getElementById(`ans-text-${globalIdx}`);

            card.classList.remove('correct', 'wrong');
            document.querySelectorAll(`#q-${globalIdx} .opt-label`).forEach(el => {
                el.classList.remove('correct-opt', 'wrong-opt', 'disabled-opt');
            });

            document.querySelectorAll(`#q-${globalIdx} input[type="radio"]`).forEach(r => r.disabled = true);

            const isCorrect = (selected === q.answer);
            const letter = ['a', 'b', 'c', 'd'][q.answer];

            const correctLabel = document.getElementById(`opt-${globalIdx}-${q.answer}`);
            if (correctLabel) correctLabel.classList.add('correct-opt');

            if (!isCorrect) {
                const wrongLabel = document.getElementById(`opt-${globalIdx}-${selected}`);
                if (wrongLabel) wrongLabel.classList.add('wrong-opt');
                card.classList.add('wrong');
                statusEl.innerHTML = `<span class="icon">❌</span> Wrong`;
            } else {
                card.classList.add('correct');
                statusEl.innerHTML = `<span class="icon">✅</span> Correct`;
            }

            ansDiv.className = `q-answer show ${isCorrect ? 'correct-ans' : 'wrong-ans'}`;
            ansText.textContent = `Correct answer: ${letter}) ${q.options[q.answer]}`;

            if (!answeredQuestions.has(globalIdx)) {
                answeredQuestions.add(globalIdx);
                if (isCorrect) answeredCorrect++;
            }
            updateScore();
        }

        function updateScore() {
            let correct = 0;
            answeredQuestions.forEach(idx => {
                const q = allQuestions[idx];
                const selectedRadio = document.querySelector(`#q-${idx} input[type="radio"]:checked`);
                if (selectedRadio) {
                    const val = parseInt(selectedRadio.value);
                    if (val === q.answer) correct++;
                }
            });
            answeredCorrect = correct;
            scoreDisplay.textContent = answeredCorrect;
            const pct = totalQuestions > 0 ? Math.round((answeredCorrect / totalQuestions) * 100) : 0;
            progressText.textContent = `${answeredCorrect} / ${totalQuestions} correct  ·  ${pct}%`;
        }

        function resetAll() {
            document.querySelectorAll('input[type="radio"]').forEach(r => {
                r.checked = false;
                r.disabled = false;
            });
            document.querySelectorAll('.q-card').forEach(c => {
                c.classList.remove('correct', 'wrong');
            });
            document.querySelectorAll('.opt-label').forEach(el => {
                el.classList.remove('correct-opt', 'wrong-opt', 'disabled-opt');
            });
            document.querySelectorAll('.q-answer').forEach(el => {
                el.className = 'q-answer';
            });
            document.querySelectorAll('.q-status').forEach(el => {
                el.innerHTML = '';
            });
            answeredQuestions.clear();
            answeredCorrect = 0;
            updateScore();
            document.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = false);
        }

        function showAllAnswers() {
            allQuestions.forEach((q, idx) => {
                const ansDiv = document.getElementById(`ans-${idx}`);
                const ansText = document.getElementById(`ans-text-${idx}`);
                const letter = ['a', 'b', 'c', 'd'][q.answer];
                ansDiv.className = 'q-answer show correct-ans';
                ansText.textContent = `Correct answer: ${letter}) ${q.options[q.answer]}`;
                const correctLabel = document.getElementById(`opt-${idx}-${q.answer}`);
                if (correctLabel) correctLabel.classList.add('correct-opt');
                document.querySelectorAll(`#q-${idx} input[type="radio"]`).forEach(r => r.disabled = true);
                const statusEl = document.getElementById(`status-${idx}`);
                statusEl.innerHTML = `<span class="icon">📖</span> Revealed`;
            });
        }

        function hideAllAnswers() {
            allQuestions.forEach((q, idx) => {
                if (!answeredQuestions.has(idx)) {
                    const ansDiv = document.getElementById(`ans-${idx}`);
                    ansDiv.className = 'q-answer';
                    document.querySelectorAll(`#q-${idx} .opt-label`).forEach(el => {
                        el.classList.remove('correct-opt', 'wrong-opt');
                    });
                    document.querySelectorAll(`#q-${idx} input[type="radio"]`).forEach(r => r.disabled = false);
                    document.getElementById(`status-${idx}`).innerHTML = '';
                }
            });
        }

        // --------------------------------------------------------------
        // EVENT BINDINGS
        // --------------------------------------------------------------
        document.getElementById('resetBtn').addEventListener('click', resetAll);
        document.getElementById('showAllBtn').addEventListener('click', showAllAnswers);
        document.getElementById('hideAllBtn').addEventListener('click', hideAllAnswers);

        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) {
                scrollTopBtn.classList.add('visible');
            } else {
                scrollTopBtn.classList.remove('visible');
            }
        });
        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Keyboard shortcut: Escape to reset
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') resetAll();
        });

        // Init
        updateScore();
        console.log('✅ TEC Assessment loaded. Total questions:', totalQuestions);
    </script>

</body>
</html>
